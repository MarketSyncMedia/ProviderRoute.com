name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          # Keep in step with the other workflows and .nvmrc -- the widget must
          # be built and tested on the same runtime it is deployed on. jsdom 30
          # also requires Node ^22.22.2 || ^24.15.0 || >=26.0.0.
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Install locked widget dependencies
        working-directory: widget
        run: npm ci

      - name: Complete release verification
        run: npm run verify

      - name: Generate CycloneDX software bills of materials
        run: |
          npm sbom --sbom-format cyclonedx > sbom-application.cdx.json
          npm --prefix widget sbom --sbom-format cyclonedx > sbom-widget.cdx.json

      - name: Upload software bills of materials
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: software-bills-of-materials
          path: |
            sbom-application.cdx.json
            sbom-widget.cdx.json
          if-no-files-found: error
          retention-days: 30

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
      # Read-only, for the registry login below.
      packages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.109.0

      # The Supabase images come from ghcr.io, which throttles anonymous pulls
      # from shared runners. Logging in helps but does not remove the limit;
      # scripts/verify-database.mjs falls back to other registries.
      - name: Log in to GitHub's container registry
        env:
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

      # Every registry rate-limits shared runners, so keep the ~1 GB of
      # Supabase images in the Actions cache and only pull when the versions
      # change. The key follows what decides those versions: the CLI version
      # above and the service versions pinned in supabase/.temp.
      - name: Restore cached Supabase images
        id: supabase-images
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/supabase-images.tar
          key: supabase-images-cli-2.109.0-${{ hashFiles('supabase/.temp/*-version', 'supabase/config.toml') }}

      - name: Load cached Supabase images
        if: steps.supabase-images.outputs.cache-hit == 'true'
        run: docker load -i "$RUNNER_TEMP/supabase-images.tar"

      - name: Rebuild and verify disposable database
        id: verify-db
        run: npm run verify:db -- --allow-reset

      # Only after a full run, so the cache never holds a partial image set.
      - name: Export Supabase images for the cache
        if: steps.supabase-images.outputs.cache-hit != 'true' && steps.verify-db.outcome == 'success'
        run: |
          images=$(docker image ls --format '{{.Repository}}:{{.Tag}}' | grep -E 'supabase|postgrest|kong|mailpit' | grep -v '<none>')
          docker save $images -o "$RUNNER_TEMP/supabase-images.tar"

      - name: Save Supabase images to the cache
        if: steps.supabase-images.outputs.cache-hit != 'true' && steps.verify-db.outcome == 'success'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/supabase-images.tar
          key: ${{ steps.supabase-images.outputs.cache-primary-key }}
